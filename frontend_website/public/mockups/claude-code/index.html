<div class="window" id="win">

  <!-- ============ sidebar ============ -->
  <aside class="sidebar">
    <div class="side-top">
      <div class="lights"><i class="light r"></i><i class="light y"></i><i class="light g"></i></div>
      <button class="sq" id="toggleSidebar" title="Toggle sidebar"><i class="ic" data-icon="Sidebar"></i></button>
      <button class="sq" id="searchBtn" title="Search"><i class="ic" data-icon="Search"></i></button>
      <span style="flex:1"></span>
      <button class="sq" id="themeBtn" title="Appearance"><i class="ic" data-icon="Sun"></i></button>
    </div>

    <div class="segmented">
      <button class="seg" data-seg="home"><i class="ic" data-icon="Home"></i> Home</button>
      <button class="seg on" data-seg="code"><i class="ic" data-icon="CodeBrackets"></i> Code</button>
    </div>

    <div class="side-scroll">
      <button class="row"><i class="ic" data-icon="Add"></i><span class="label">New session</span></button>
      <button class="row"><i class="ic" data-icon="Lightning"></i><span class="label">Routines</span></button>
      <button class="row"><i class="ic" data-icon="Styles"></i><span class="label">Customize</span></button>
      <button class="row more"><i class="ic" data-icon="CaretDown"></i><span class="label">More</span></button>

      <div class="group-label">Pinned</div>
      <div id="pinned"></div>

      <div class="group-label">Scheduled</div>
      <div id="scheduled"></div>

      <div class="group-label">Recents</div>
      <div id="recents"></div>
    </div>

    <div class="side-foot">
      <i class="ic" data-icon="User"></i>
      <span class="name" id="userName">Susan Sample</span>
      <button class="gear" title="Settings"><i class="ic" data-icon="Settings"></i></button>
    </div>
  </aside>

  <!-- ============ main ============ -->
  <main class="main">
    <div class="rail">
      <div class="lights"><i class="light r"></i><i class="light y"></i><i class="light g"></i></div>
      <button class="sq" id="expandSidebar" title="Show sidebar"><i class="ic" data-icon="Sidebar"></i></button>
      <button class="sq" id="searchBtn2" title="Search"><i class="ic" data-icon="Search"></i></button>
    </div>

    <div class="crumb">
      <span class="repo" id="repoName">acme-storefront</span>
      <span class="slash">/</span>
      <button class="task"><span id="taskName">Write tests for the payments module</span><i class="ic" data-icon="CaretDown"></i></button>
    </div>

    <div class="stream" id="stream"></div>

    <div class="dock">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Describe a task or ask a question"></textarea>
        <button class="enter" id="send" title="Send"><i class="ic" data-icon="ArrowReturn"></i></button>
      </div>

      <div class="toolbar">
        <button class="tbtn" id="btnMode">Auto <i class="ic caret" data-icon="CaretDown"></i></button>
        <button class="tbtn" id="btnPlus" title="Add context and connectors"><i class="ic" data-icon="Add"></i><span class="badge" id="connCount" hidden>0</span></button>
        <button class="tbtn" id="btnMic"><i class="ic" data-icon="Microphone"></i><i class="ic caret" data-icon="CaretDown"></i></button>
        <span class="spacer"></span>
        <button class="tbtn strong" id="btnModel">Opus</button>
        <button class="tbtn dim" id="btnEffort">Extra high</button>
        <span class="busy" id="busy" title="Context usage"><i class="ic" data-icon="Spinner"></i></span>
      </div>

      <!-- popovers -->
      <div class="pop" id="popMode" style="left:0">
        <div class="pop-title">Permissions</div>
        <div id="modeOpts"></div>
      </div>

      <div class="pop" id="popPlus">
        <div class="conn-search">
          <i class="ic" data-icon="Search"></i>
          <input id="connFilter" placeholder="Search connectors and context">
        </div>
        <div class="conn-list" id="connList"></div>
        <button class="pop-foot"><i class="ic" data-icon="Connectors"></i> Manage connectors</button>
      </div>

      <div class="pop" id="popModel">
        <div class="model-head">
          <span>Models</span>
          <span class="model-shortcuts" aria-hidden="true"><kbd>⇧</kbd><kbd>⌘</kbd><kbd>|</kbd></span>
        </div>
        <div id="modelOpts"></div>
      </div>
    </div>
  </main>
</div>

<div class="scrim" id="scrim"></div>

<script src="icons.js"></script>
<script src="graph.js"></script>
<script src="session.js"></script>
<script src="app.js"></script>
</body>
</html>
