<!doctype html>
<html lang="en" data-theme="paper">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenGraph AI — graph loop</title>
    <style>
      :root {
        --ground: #f4f2ed;
        --ground-ink-rgb: 17 19 23;
      }
      html,
      body {
        margin: 0;
        background: var(--ground);
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      .graph-loop {
        width: min(100vw, 1600px);
      }
      .graph-loop[data-capture] {
        width: 2560px;
        height: 1080px;
        aspect-ratio: auto;
      }
      .graph-loop[data-portrait] {
        width: min(100vw, 540px);
        aspect-ratio: 4 / 5;
      }
      .graph-loop[data-capture][data-portrait] {
        width: 1080px;
        height: 1350px;
        aspect-ratio: auto;
      }
    </style>
  </head>
  <body>
    <!-- Preview: /graph-loop.html (add ?portrait for the phone cut). Frame export: /graph-loop.html?capture -->
    <figure class="graph-loop" data-graph-loop data-grid aria-hidden="true"><canvas></canvas></figure>
    <script type="module">
      const params = new URLSearchParams(location.search);
      const figure = document.querySelector("[data-graph-loop]");
      if (params.has("capture")) figure.setAttribute("data-capture", "");
      if (params.has("portrait")) figure.setAttribute("data-portrait", "");
    </script>
    <script type="module" src="/src/graph-loop/mount.js"></script>
  </body>
</html>
